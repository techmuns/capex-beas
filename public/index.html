<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Capex Change Monitor</title>
  <meta name="description" content="Companies that changed how much they plan to spend on new plants & machines — every figure backed by the company's own BSE filing." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E" />

  <!-- CDN libs only — no build step. (Tailwind dropped; the page owns its CSS.) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

  <style>
    :root{
      --bg:#FBFAFF; --card:#ffffff; --ink:#14152A; --muted:#6B7280; --line:#ECEAF6; --line2:#F3F1FB;
      --chip-bg:#F1EEFE; --chip-ink:#6D28D9;
      --up:#059669; --up-bg:#E7F8F0; --down:#E11D48; --down-bg:#FDECEF; --newc:#7C3AED; --new-bg:#F3F0FF;
      --b1:#6366F1; --b2:#8B5CF6; --b3:#EC4899;
      --shadow:0 10px 30px rgba(20,21,42,.06), 0 2px 6px rgba(20,21,42,.04);
      --field:#ffffff;
      /* aliases so the self-contained Brief drawer (brief.js) keeps its brand colors */
      --i1:#6366F1; --i2:#8B5CF6; --pink:#EC4899;
      /* table row kinds (match the email): raised / cut / new plan / routine + zebra */
      --zebra:#FAF9FE; --k-up:#0F9D6B; --k-down:#E11D48; --k-new:#2563EB; --k-routine:#64748B;
    }
    @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
      --bg:#0E0F1C; --card:#17182B; --ink:#ECEEFB; --muted:#9AA0B4; --line:#262A44; --line2:#20233B;
      --chip-bg:#241E3A; --chip-ink:#C4B5FD;
      --up:#34D399; --up-bg:#0F2A22; --down:#FB7185; --down-bg:#2A0F17; --newc:#A78BFA; --new-bg:#1E1A33;
      --shadow:0 12px 34px rgba(0,0,0,.45); --field:#12132322;
      --i1:#818CF8; --i2:#A78BFA; --pink:#F472B6;
      --zebra:#1B1C30; --k-up:#34D399; --k-down:#FB7185; --k-new:#60A5FA; --k-routine:#94A3B8;
    }}
    :root[data-theme="dark"]{
      --bg:#0E0F1C; --card:#17182B; --ink:#ECEEFB; --muted:#9AA0B4; --line:#262A44; --line2:#20233B;
      --chip-bg:#241E3A; --chip-ink:#C4B5FD;
      --up:#34D399; --up-bg:#0F2A22; --down:#FB7185; --down-bg:#2A0F17; --newc:#A78BFA; --new-bg:#1E1A33;
      --shadow:0 12px 34px rgba(0,0,0,.45); --field:#12132322;
      --i1:#818CF8; --i2:#A78BFA; --pink:#F472B6;
      --zebra:#1B1C30; --k-up:#34D399; --k-down:#FB7185; --k-new:#60A5FA; --k-routine:#94A3B8;
    }
    *{box-sizing:border-box}
    body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.45;
      background-image:
        radial-gradient(46rem 40rem at 92% -12%, rgba(139,92,246,.13), transparent 60%),
        radial-gradient(40rem 40rem at -8% 4%, rgba(236,72,153,.10), transparent 58%);
      background-attachment:fixed;}
    .disp,.font-display{font-family:'Space Grotesk','Inter',sans-serif;}
    .num{font-variant-numeric:tabular-nums;}
    .wrap{max-width:1000px; margin:0 auto; padding-inline:16px; padding-block:20px 44px;}

    .head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
    .brand{display:flex; align-items:center; gap:13px;}
    .logo{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:22px;
      background:linear-gradient(135deg,var(--b1),var(--b3)); box-shadow:0 8px 20px rgba(139,92,246,.4);}
    h1{margin:0; font-size:clamp(20px,4.5vw,27px); font-weight:700; letter-spacing:-.01em;}
    .sub{margin:3px 0 0; color:var(--muted); font-size:14px; max-width:48ch;}
    .actions{display:flex; gap:9px; flex-wrap:wrap;}
    .btn{font-family:inherit; font-size:13px; font-weight:600; border-radius:999px; padding:9px 15px; cursor:pointer;
      border:1px solid var(--line); background:var(--card); color:var(--ink); display:inline-flex; align-items:center; gap:7px;
      transition:transform .15s ease;}
    .btn.solid{border-color:transparent; color:#fff; background:linear-gradient(90deg,var(--b1),var(--b2) 60%,var(--b3));
      box-shadow:0 8px 18px rgba(139,92,246,.32);}
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.6; cursor:default; transform:none;}

    .updated{font-size:12px; color:var(--muted); align-self:center;}

    /* summary */
    .summary{margin:16px 0 4px; font-size:15px; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
    .summary .big{font-family:'Space Grotesk'; font-weight:700; font-size:17px;}
    .pipe{color:var(--muted)}
    .up{color:var(--up)} .down{color:var(--down)} .newc{color:var(--newc)}

    /* controls */
    .controls{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:16px 0 10px;
      background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow);}
    .fld{display:flex; flex-direction:column; gap:5px;}
    .fld label{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.02em;}
    select,input{font-family:inherit; font-size:14px; color:var(--ink); background:var(--card);
      border:1px solid var(--line); border-radius:11px; padding:9px 12px; outline:none;}
    select:focus,input:focus{border-color:var(--b2); box-shadow:0 0 0 3px color-mix(in srgb,var(--b2) 18%, transparent);}
    .grow{flex:1; min-width:170px;}
    .controls .btn.solid{margin-left:auto; align-self:flex-end;}

    .everything{margin:0 2px 18px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:7px;}
    .everything input{width:15px; height:15px; accent-color:var(--b2); padding:0; margin:0;}
    .everything label{display:inline-flex; align-items:center; gap:7px; cursor:pointer;}

    /* list */
    .list{display:flex; flex-direction:column; gap:12px;}
    .row{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; box-shadow:var(--shadow);
      transition:transform .15s ease, box-shadow .15s ease;}
    .row:hover{transform:translateY(-2px); box-shadow:0 18px 40px rgba(20,21,42,.12);}
    .rtop{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
    .cdot{width:10px; height:10px; border-radius:50%; flex:none;}
    .cdot.up{background:var(--up)} .cdot.down{background:var(--down)} .cdot.newc{background:var(--newc)}
    .co{font-family:'Space Grotesk'; font-weight:700; font-size:16.5px; cursor:pointer; color:var(--ink);}
    .co:hover{text-decoration:underline; text-decoration-color:var(--b2);}
    .chip{font-size:11.5px; font-weight:600; color:var(--chip-ink); background:var(--chip-bg); border-radius:999px; padding:3px 10px;}
    .mc{font-size:12px; color:var(--muted);}
    .badge{margin-left:auto; font-size:12.5px; font-weight:700; border-radius:999px; padding:4px 11px; white-space:nowrap;}
    .badge.up{color:var(--up); background:var(--up-bg);} .badge.down{color:var(--down); background:var(--down-bg);}
    .badge.newc{color:var(--newc); background:var(--new-bg);}
    .headline{margin:11px 0 0; font-family:'Space Grotesk'; font-weight:600; font-size:18px; letter-spacing:-.01em;}
    .headline .arw{color:var(--muted); margin:0 6px;}
    .why{margin:6px 0 0; font-size:14px; color:var(--ink);}
    .why b{color:var(--muted); font-weight:600;}
    .rmeta{margin:11px 0 0; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
    .rmeta a{color:var(--b1); font-weight:600; text-decoration:none;}
    .rmeta a:hover{text-decoration:underline;}
    .none{text-align:center; color:var(--muted); background:var(--card); border:1px dashed var(--line);
      border-radius:18px; padding:34px 20px;}

    /* custom date range (revealed when Period = Custom) */
    .range{display:flex; gap:10px; align-items:flex-end;}
    .range input[type="date"]{min-width:150px;}

    /* data table (Part A) — horizontal scroll stays inside the card, never the page */
    .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card);
      border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);}
    table.dt{width:100%; min-width:720px; border-collapse:collapse; font-size:14px;}
    table.dt thead th{position:sticky; top:0; z-index:2; background:var(--card); text-align:left;
      font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--muted);
      padding:13px 15px; border-bottom:1px solid var(--line); white-space:nowrap;}
    table.dt tbody td{padding:13px 15px; border-top:1px solid var(--line2); vertical-align:middle;}
    table.dt tbody tr:nth-child(even) td{background:var(--zebra);}
    table.dt tbody tr:hover td{background:color-mix(in srgb,var(--b2) 9%, transparent);}
    table.dt tbody td:first-child{border-left:4px solid transparent;}
    table.dt tbody tr.k-up td:first-child{border-left-color:var(--k-up);}
    table.dt tbody tr.k-down td:first-child{border-left-color:var(--k-down);}
    table.dt tbody tr.k-new td:first-child{border-left-color:var(--k-new);}
    table.dt tbody tr.k-routine td:first-child{border-left-color:var(--k-routine);}
    .dt .co{font-family:'Space Grotesk'; font-weight:700; font-size:14.5px; cursor:pointer; color:var(--ink);}
    .dt .co:hover{text-decoration:underline; text-decoration-color:var(--b2);}
    .dt .sub2{font-size:11.5px; color:var(--muted); margin-top:2px;}
    .dt .arw{color:var(--muted); margin:0 7px;}
    .dt .when{color:var(--muted); white-space:nowrap;}
    .dt a.src{color:var(--b1); font-weight:600; text-decoration:none; white-space:nowrap;}
    .dt a.src:hover{text-decoration:underline;}
    .pill{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700;
      border-radius:999px; padding:3px 10px; white-space:nowrap;}
    .pill.k-up{color:var(--k-up); background:color-mix(in srgb,var(--k-up) 14%, transparent);}
    .pill.k-down{color:var(--k-down); background:color-mix(in srgb,var(--k-down) 14%, transparent);}
    .pill.k-new{color:var(--k-new); background:color-mix(in srgb,var(--k-new) 14%, transparent);}
    .pill.k-routine{color:var(--k-routine); background:color-mix(in srgb,var(--k-routine) 16%, transparent);}
    .fy{margin-left:8px; font-size:12px; color:var(--muted); font-weight:600;}
    .delta{margin-left:10px; font-size:11.5px; font-weight:700; border-radius:6px; padding:1px 7px;}
    .delta.up{color:var(--k-up); background:color-mix(in srgb,var(--k-up) 14%, transparent);}
    .delta.down{color:var(--k-down); background:color-mix(in srgb,var(--k-down) 14%, transparent);}

    footer{margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted);
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

    /* company history modal */
    .modal-overlay{position:fixed; inset:0; background:rgba(20,21,42,.5); opacity:0; pointer-events:none;
      transition:opacity .2s ease; z-index:70; display:grid; place-items:center; padding:16px;}
    .modal-overlay.show{opacity:1; pointer-events:auto;}
    .modal{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 30px 80px rgba(0,0,0,.35);
      width:min(760px,96vw); max-height:88vh; overflow:auto; transform:translateY(12px); transition:transform .2s ease;}
    .modal-overlay.show .modal{transform:translateY(0);}
    .modal-pad{padding:22px 24px 26px;}
    .modal-x{position:sticky; top:0; float:right; background:none; border:none; cursor:pointer; color:var(--muted);
      font-size:22px; line-height:1; padding:2px 6px; border-radius:8px;}
    .modal-x:hover{background:var(--line2); color:var(--ink);}
    .chart-lg{width:100%; height:300px; margin-top:8px;}
    table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:6px;}
    table.tbl th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
      padding:8px 10px; white-space:nowrap; border-bottom:1px solid var(--line);}
    table.tbl td{padding:9px 10px; border-top:1px solid var(--line2); vertical-align:top;}
    table.tbl a{color:var(--b1); font-weight:600; text-decoration:none;} table.tbl a:hover{text-decoration:underline;}

    /* toast */
    #toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); opacity:0;
      background:var(--ink); color:var(--bg); font-size:13px; font-weight:500; padding:11px 16px; border-radius:12px;
      box-shadow:0 14px 34px rgba(0,0,0,.28); pointer-events:none; transition:opacity .2s ease, transform .2s ease; max-width:88vw; z-index:80;}
    #toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
    @media (max-width:560px){ .badge{margin-left:0;} .controls .btn.solid{margin-left:0; width:100%; justify-content:center;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="brand">
        <div class="logo">📡</div>
        <div>
          <h1 class="disp">Capex Change Monitor</h1>
          <p class="sub">Companies that changed how much they plan to spend on new plants &amp; machines — updated daily.</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="briefBtn" type="button">✉️ Email brief</button>
        <span class="updated num" id="updated"></span>
      </div>
    </header>

    <div class="summary" id="summary"></div>
    <div class="controls" id="controls"></div>

    <main>
      <div class="list" id="list"></div>
      <div class="none" id="none" style="display:none"></div>
    </main>

    <footer>
      <span>🔒 Source-backed — every figure comes from a real BSE filing, with a link to the original PDF. Market caps &amp; P/E are approximate context, not from the filing.</span>
    </footer>
  </div>

  <div class="modal-overlay" id="modal"><div class="modal"><div class="modal-pad" id="modalBody"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/brief.js"></script>
</body>
</html>
